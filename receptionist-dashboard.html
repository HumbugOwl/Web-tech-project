
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore - Receptionist Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>MediCore</h1>
            <p>Receptionist Dashboard</p>
        </div>

        <div class="form-container">

            <h2>Welcome, Receptionist!</h2>
            <p class="subtitle">Manage patient appointments</p>

            <div class="dashboard-menu">

                <div class="dashboard-card">
                    <h3>Total Appointments</h3>
                    <p id="totalAppointments">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Pending Appointments</h3>
                    <p id="pendingAppointments">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Approved Appointments</h3>
                    <p id="approvedAppointments">0</p>
                </div>

            </div>

            <h2>Appointment Management</h2>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Department</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="receptionistAppointmentList">
                        <tr>
                            <td colspan="5">No appointments found.</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <button onclick="goToBooking()">
                Book Appointment
            </button>

            <button class="back-button" onclick="logout()">
                Logout
            </button>

        </div>

        <footer>
            © 2026 MediCore Hospital Management System
        </footer>

    </div>

    <script src="receptionist-dashboard.js"></script>
</body>
</html>
